<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External images test</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            color: #131713;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        #status {
            margin-bottom: 2rem;
        }

        .images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
            gap: 0.5rem;
        }

        figure {
            margin: 0;
        }

        img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1.2;
            object-fit: cover;
            background: #6a836e;
        }

        figcaption {
            padding-top: 0.35rem;
            font-size: 0.75rem;
        }

        .error {
            color: #a00000;
        }
    </style>
</head>
<body>
    <h1>Images used by index</h1>
    <p id="status">Loading images from Picsum Photos...</p>
    <main class="images" id="images"></main>

    <script type="module">
        import { fetchImages } from './api/images.js';

        const status = document.querySelector('#status');
        const imagesContainer = document.querySelector('#images');

        fetchImages()
            .then((images) => {
                imagesContainer.replaceChildren(...images.map((image, index) => {
                    const figure = document.createElement('figure');
                    const element = document.createElement('img');
                    const caption = document.createElement('figcaption');

                    element.src = image.url;
                    element.alt = `${image.author} image ${index + 1}`;
                    element.loading = 'lazy';
                    element.addEventListener('error', () => {
                        caption.textContent = `Image ${index + 1} failed to load`;
                        caption.className = 'error';
                    });

                    caption.textContent = `${index + 1}. ${image.author} (ID: ${image.id})`;
                    figure.append(element, caption);
                    return figure;
                }));

                status.textContent = `${images.length} images loaded from the external API.`;
            })
            .catch((error) => {
                console.error('Unable to load external images:', error);
                status.className = 'error';
                status.textContent = `Unable to load external images: ${error.message}`;
            });
    </script>
</body>
</html>
