<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Verde</title>
    <script src="js/head.js"></script>
</head>
<body>
    <div data-component="header"></div>

    <main>
        <section class="hero">
            <h1 class="hero-title">
                I'M JOÃO VERDE AND IM A MULTIMEDIA DESIGNER. MY GOAL IS TO RESOLVE PROBLEMS THAT ONLY DESIGN CAN, AND TO ACHIEVE IT IM AIMING TO CREATE BETTER DESIGNS AND EXPERIMENTING DIFFERENT THINGS EVERYDAY, TAKE A LOOK AT MY WORK!
            </h1>
        </section>
        <section class="projects-section">
            <div class="projects-grid" data-project-grid></div>
            <header class="projects-header">
                <div class="project-stats">
                    <span class="stats-label">No. Projetos</span>
                    <span class="stats-number" data-project-count>0</span>
                </div>
                <div class="projects-filter">
                    <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="project-filters">
                        <span data-filter-label>All projects</span>
                        <span data-filter-icon aria-hidden="true">↓</span>
                        <span class="expand-icon" data-filter-icon aria-hidden="true">[expand]</span>
                    </button>
                    <div class="filter-options" id="project-filters" aria-hidden="true"></div>
                </div>
            </header>

            <div class="projects-list" data-project-list></div>
        </section>

    </main>
    <div data-component="footer"></div>

    <script type="module" src="js/js_import.js"></script>
</body>
</html>
