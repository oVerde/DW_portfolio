<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Verde</title>
    <script type="module" src="js/head.js"></script>
</head>
<body>
    <div data-component="header"></div>

    <main>
        <section class="hero">
            <h1 class="hero-title">
                I'M JOÃO VERDE AND IM A MULTIMEDIA DESIGNER. MY GOAL IS TO RESOLVE PROBLEMS THAT ONLY DESIGN CAN, AND TO ACHIEVE IT IM AIMING TO CREATE BETTER DESIGNS AND EXPERIMENTING DIFFERENT THINGS EVERYDAY, TAKE A LOOK AT MY WORK!
            </h1>
        </section>
        <section class="projects-section">
            <div class="projects-grid" data-project-grid></div>
            <header class="projects-header">
                <div class="project-stats">
                    <span class="stats-label">No. Projetos</span>
                    <span class="stats-number" data-project-count>0</span>
                </div>
                <div class="projects-filter">
                    <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="project-filters">
                        <span data-filter-label>All projects</span>
                        <span data-filter-icon aria-hidden="true">↓</span>
                        <span class="expand-icon" data-filter-icon aria-hidden="true">[expand]</span>
                    </button>
                    <div class="filter-options" id="project-filters" aria-hidden="true"></div>
                </div>
            </header>

            <div class="projects-list" data-project-list></div>
        </section>
        <template id="project-detail-template">
            <article class="project-detail-page">
                <nav class="topbar" aria-label="Project navigation">
                    <button class="topbar__link project-detail-close" type="button">Close</button>
                    <a class="topbar__link" href="#" data-project-website hidden>Open Website</a>
                </nav>




                
                <div class="page">
                    <header class="project-header">
                        <h1 class="title project-detail-title"></h1>
                        <div class="project-header__row">
                            <div class="project-header__info">
                                <p class="summary project-detail-summary"></p>
                                <ul class="tags project-detail-tags"></ul>
                            </div>
                            <a class="btn project-detail-about" href="#project-detail-content">About Project +</a>
                        </div>
                    </header>

                    <div class="media media--hero project-detail-hero"></div>

                    <p class="statement statement--center project-detail-statement"></p>

                    <div class="grid-2 project-detail-gallery">
                        <template id="project-detail-image-template">
                            <div class="media media--tall project-detail-media"></div>
                        </template>
                    </div>

                    <p class="statement statement--left project-detail-statement"></p>

                    <div class="grid-2">
                        <div class="media media--tall project-detail-secondary-media"></div>
                    </div>

                    <section id="project-detail-content" class="project-detail-content">
                        <h2 class="project-detail-content-title">About the project</h2>
                        <p class="project-detail-description"></p>
                    </section>

                    <footer class="next project-header">
                        <p class="next__label">next project</p>
                        <h2 class="title next-project-title"></h2>
                        <div class="project-header__row">
                            <div class="project-header__info">
                                <p class="summary next-project-summary"></p>
                                <ul class="tags next-project-tags"></ul>
                            </div>
                            <button class="btn next-project-link" type="button">Next Project →</button>
                        </div>
                    </footer>
                </div>
            </article>
        </template>
        <div data-project-detail aria-hidden="true"></div>

    </main>
    <div data-component="footer"></div>

    <script type="module" src="js/js_import.js"></script>
</body>
</html>
